services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "./migrations",
        "-database",
        "postgres://postgres:postgres@db:5432/db?sslmode=disable",
        "up"
      ]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgres://postgres:postgres@db:5432/db?sslmode=disable
    env_file:
      - .env
    volumes:
      - /Users/masraga/firebase-service-account.json/service-account.json:/app/firebase-service-account.json
    ports:
      - "1323:1323"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/db?sslmode=disable
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
    depends_on:
      - migrate

volumes:
  postgres_data: